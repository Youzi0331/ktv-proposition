<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>命题KTV</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1 class="title">🎤 命题KTV</h1>
            <div class="header-actions">
                <button class="library-toggle" id="libraryToggle">我的曲库</button>
                <button class="auth-btn" id="authBtn">登录</button>
            </div>
        </header>

        <!-- 主游戏区 -->
        <main class="main-area" id="mainArea">
            <!-- 用户状态提示 -->
            <div class="user-status" id="userStatus">
                <span class="status-badge">游客模式</span>
            </div>

            <div class="topic-display">
                <div class="topic-text" id="topicText">
                    点击开始，让命题为你选择...
                </div>
            </div>

            <button class="action-btn" id="actionBtn">开始</button>

            <div class="answer-section" id="answerSection">
                <button class="answer-btn" id="answerBtn">🎵 帮我作答</button>
                <div class="songs-result" id="songsResult"></div>
            </div>

            <!-- 登录后显示的功能入口 -->
            <div class="extra-features" id="extraFeatures" style="display: none;">
                <button class="feature-btn" id="myTopicsBtn">📝 我的命题</button>
            </div>
        </main>

        <!-- 曲库管理面板 -->
        <aside class="library-panel" id="libraryPanel">
            <div class="library-header">
                <h2>我的曲库</h2>
                <button class="close-btn" id="closeLibrary">×</button>
            </div>

            <div class="add-song">
                <input
                    type="text"
                    id="songInput"
                    placeholder="输入歌名，按回车添加"
                    maxlength="50"
                >
                <button id="addSongBtn">添加</button>
            </div>

            <div class="song-list" id="songList">
                <div class="empty-hint">还没有添加歌曲哦~</div>
            </div>
        </aside>

        <!-- 登录/注册弹窗 -->
        <div class="modal" id="authModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 id="authTitle">登录</h2>
                    <button class="close-btn" id="closeAuthModal">×</button>
                </div>
                <div class="modal-body">
                    <div class="auth-tabs">
                        <button class="tab-btn active" data-tab="login">登录</button>
                        <button class="tab-btn" data-tab="register">注册</button>
                    </div>
                    <form id="authForm">
                        <input
                            type="text"
                            id="authUsername"
                            placeholder="用户名 (3-20个字符)"
                            maxlength="20"
                            required
                        >
                        <input
                            type="password"
                            id="authPassword"
                            placeholder="密码 (至少6个字符)"
                            minlength="6"
                            required
                        >
                        <button type="submit" class="submit-btn" id="authSubmitBtn">登录</button>
                    </form>
                    <div class="auth-hint">
                        <p>💡 游客模式只能玩内置50题</p>
                        <p>登录后可以添加自定义命题和云端同步曲库</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 自定义命题管理面板 -->
        <aside class="topics-panel" id="topicsPanel">
            <div class="library-header">
                <h2>我的命题</h2>
                <button class="close-btn" id="closeTopics">×</button>
            </div>

            <div class="add-topic">
                <textarea
                    id="topicInput"
                    placeholder="输入你的命题（至少10个字符）"
                    maxlength="200"
                    rows="3"
                ></textarea>
                <button id="addTopicBtn">添加</button>
            </div>

            <div class="topic-list" id="topicList">
                <div class="empty-hint">还没有添加自定义命题哦~</div>
            </div>
        </aside>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
